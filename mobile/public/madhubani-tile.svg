<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220" fill="none" stroke="#E9B23C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <!-- Original Madhubani-style line motifs drawn for NISAARTHI: fish, lotus, kachni hatching, dot rows -->
  <!-- fish -->
  <g transform="translate(14 26)">
    <path d="M8 34 Q44 6 82 34 Q44 62 8 34 Z"/>
    <path d="M14 34 Q44 14 76 34 Q44 54 14 34 Z"/>
    <path d="M82 34 L102 18 L96 34 L102 50 Z"/>
    <circle cx="24" cy="31" r="3.2"/>
    <circle cx="24" cy="31" r="0.8" fill="#E9B23C"/>
    <path d="M38 22 Q44 34 38 46 M48 20 Q54 34 48 48 M58 22 Q64 34 58 46 M68 26 Q72 34 68 42"/>
    <path d="M44 6 L48 0 M54 8 L60 2 M64 12 L70 6"/>
  </g>
  <!-- lotus -->
  <g transform="translate(150 158)">
    <g id="p">
      <path d="M0 0 Q-14 -24 0 -48 Q14 -24 0 0 Z"/>
      <path d="M0 -8 Q-7 -24 0 -40 Q7 -24 0 -8"/>
    </g>
    <use href="#p" transform="rotate(-42)"/>
    <use href="#p" transform="rotate(42)"/>
    <use href="#p" transform="rotate(-80) scale(.78)"/>
    <use href="#p" transform="rotate(80) scale(.78)"/>
    <path d="M-40 6 Q0 22 40 6"/>
    <path d="M-34 12 Q0 26 34 12"/>
  </g>
  <!-- sun -->
  <g transform="translate(172 52)">
    <circle r="12"/><circle r="17"/>
    <path d="M0 -22 L4 -30 L-4 -30 Z M22 0 L30 4 L30 -4 Z M0 22 L4 30 L-4 30 Z M-22 0 L-30 4 L-30 -4 Z"/>
    <path d="M15.5 -15.5 L23 -19 L19 -23 Z M15.5 15.5 L23 19 L19 23 Z M-15.5 15.5 L-23 19 L-19 23 Z M-15.5 -15.5 L-23 -19 L-19 -23 Z"/>
  </g>
  <!-- leaf sprig -->
  <g transform="translate(40 150)">
    <path d="M0 50 Q8 20 30 0"/>
    <path d="M8 34 Q-8 30 -10 18 Q4 18 8 34 Z M14 22 Q30 22 34 10 Q20 8 14 22 Z M20 14 Q8 4 10 -6 Q22 2 20 14 Z"/>
  </g>
  <!-- dot rows -->
  <g fill="#E9B23C" stroke="none">
    <circle cx="10" cy="118" r="1.5"/><circle cx="22" cy="118" r="1.5"/><circle cx="34" cy="118" r="1.5"/>
    <circle cx="116" cy="12" r="1.5"/><circle cx="116" cy="24" r="1.5"/><circle cx="116" cy="36" r="1.5"/>
    <circle cx="100" cy="206" r="1.5"/><circle cx="88" cy="206" r="1.5"/>
  </g>
</svg>
